<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39c5cf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#21262d" opacity="0.7"/>
    </pattern>
    <clipPath id="bannerClip"><rect width="1280" height="320" rx="14"/></clipPath>
    <style>
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-420px); } 60%, 100% { transform: translateX(1480px); } }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
      .floatA { animation: floatA 9s ease-in-out infinite; }
      @keyframes floatA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-16px); } }
      .floatB { animation: floatB 11s ease-in-out infinite; }
      @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(14px); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fadeUp { animation: fadeUp 1.2s ease-out both; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <g clip-path="url(#bannerClip)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <ellipse class="floatA" cx="220" cy="90" rx="260" ry="150" fill="url(#orbBlue)"/>
    <ellipse class="floatB" cx="1080" cy="240" rx="280" ry="160" fill="url(#orbCyan)"/>
    <rect class="sweep" x="0" y="0" width="380" height="320" fill="url(#sweepGrad)" transform="skewX(-12)"/>

    <!-- shield -->
    <g class="pulse" filter="url(#glow)" transform="translate(150,62)">
      <path d="M60 10 L110 30 V85 C110 130 88 160 60 175 C32 160 10 130 10 85 V30 Z" fill="url(#shieldGrad)"/>
      <path d="M40 80 L58 98 L82 62" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- username -->
    <text class="fadeUp" x="300" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="#f0f6fc" letter-spacing="1">BluBox<tspan fill="#58a6ff">Android</tspan></text>

    <!-- accent line -->
    <rect class="fadeUp" x="302" y="192" width="120" height="4" rx="2" fill="#58a6ff"/>

    <!-- tagline -->
    <text class="fadeUp" x="302" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" fill="#8b949e" letter-spacing="6">ANDROID &#183; NETWORKING &#183; SELF-HOSTING<tspan class="cursor" fill="#58a6ff">&#9612;</tspan></text>
  </g>
  <rect width="1280" height="320" rx="14" fill="none" stroke="#21262d" stroke-width="1"/>
</svg>
