<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#30363d" opacity="0.55"/>
    </pattern>
    <clipPath id="bannerClip"><rect width="1280" height="360"/></clipPath>
    <style>
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-260px); } 55%, 100% { transform: translateX(1380px); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      .f1 { animation: fl 7s ease-in-out infinite; }
      .f2 { animation: fl 9s ease-in-out infinite; }
      .f3 { animation: fl 11s ease-in-out infinite; }
      @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
      .bar { animation: bar 5s ease-in-out infinite; }
      @keyframes bar { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.35); } }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <circle class="f1" cx="240" cy="90" r="4" fill="#58a6ff" opacity="0.5"/>
  <circle class="f2" cx="700" cy="300" r="3" fill="#58a6ff" opacity="0.35"/>
  <circle class="f3" cx="950" cy="80" r="5" fill="#1f6feb" opacity="0.4"/>
  <circle class="f2" cx="420" cy="290" r="3" fill="#8b949e" opacity="0.3"/>
  <g class="pulse" transform="translate(1015,72)" stroke="#58a6ff" stroke-width="6" fill="none">
    <path d="M60 10 L110 30 V85 C110 130 88 160 60 175 C32 160 10 130 10 85 V30 Z"/>
    <path d="M40 80 L58 98 L82 62" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="168" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="#f0f6fc">Box<tspan fill="#58a6ff">Nest</tspan></text>
  <g clip-path="url(#bannerClip)">
    <rect class="sweep" x="0" y="0" width="200" height="360" fill="#ffffff" opacity="0.055"/>
  </g>
  <rect x="94" y="196" width="120" height="6" rx="3" fill="url(#accent)"/>
  <rect class="bar" x="94" y="196" width="120" height="6" rx="3" fill="#ffffff" opacity="0.35" style="transform-origin:94px 199px"/>
  <text x="92" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" fill="#8b949e" letter-spacing="5">ANDROID &#183; NETWORKING &#183; SELF-HOSTING</text>
  <rect class="cursor" x="836" y="220" width="15" height="34" fill="#58a6ff"/>
  <rect y="354" width="1280" height="6" fill="url(#accent)"/>
</svg>
